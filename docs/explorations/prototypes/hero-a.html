<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kadabra — hero A (the cursor is the wand)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Titles: Gabarito 900 (brand). Body: Hanken Grotesk — humanist grotesque,
     tall x-height, open apertures, stays legible small on dark felt; warm
     without the roundness of Poppins/Montserrat. Not Inter/Roboto/Open Sans. -->
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800;900&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1B3A2F;--felt-deep:#12261F;--felt-up:#264C3D;
  --bone:#F3EFE6;--white:#fff;--carbon:#1C1A17;--red:#8E1424;--gold:#C9A227;
  --mint:#A8C4B4;
  --ease:cubic-bezier(.16,1,.3,1);      /* power4-style ease-out, no steps */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--felt-deep);color:var(--white);
  font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--gold);color:var(--carbon)}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:2px}
html{scrollbar-color:var(--felt-up) var(--felt-deep);scrollbar-width:thin}
::-webkit-scrollbar{width:11px}::-webkit-scrollbar-track{background:var(--felt-deep)}
::-webkit-scrollbar-thumb{background:var(--felt-up)}

.hero{
  position:relative;min-height:100svh;background:var(--felt);
  display:grid;grid-template-rows:auto 1fr auto;
  padding:clamp(22px,3.2vw,44px);padding-bottom:calc(32svh + 8px);overflow:hidden;isolation:isolate;
}
/* one soft light from top-left so the flat felt is not a paint chip */
.hero::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 8% 0%,rgba(255,255,255,.075),transparent 62%);
}
.hero > *{position:relative;z-index:2}

/* wordmark ---------------------------------------------------------- */
.mark{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--white)}
.mark svg{width:18px;height:18px;fill:var(--gold);flex:none}
.mark span{font-family:Gabarito;font-weight:900;font-size:1.32rem;letter-spacing:-.045em}

/* headline ---------------------------------------------------------- */
.mid{display:flex;flex-direction:column;justify-content:center;gap:clamp(22px,3vh,34px);
     padding:clamp(24px,5vh,70px) 0}
h1{
  font-family:Gabarito;font-weight:900;margin:0;color:var(--white);
  font-size:clamp(2.6rem,8vw,7.2rem);line-height:.92;letter-spacing:-.04em;max-width:11ch;
  text-wrap:balance;
}
h1 .w{display:inline-block;overflow:hidden;vertical-align:top}
h1 .w i{display:inline-block;font-style:normal;transform:translateY(110%);opacity:0}
h1.in .w i{transform:translateY(0);opacity:1;
  transition:transform 1.15s var(--ease),opacity .7s var(--ease)}

.sub{color:var(--mint);font-size:clamp(1rem,1.35vw,1.18rem);max-width:46ch;font-weight:400;margin:0}
.cta-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:12px;background:var(--red);color:var(--white);
  font-weight:600;font-size:1.04rem;padding:16px 28px;border-radius:2px;text-decoration:none;
  /* red on felt is ~1.3:1 as a surface, so the edge is carried by the rim + shadow,
     and the label by white at 9.3:1 */
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 14px 30px -12px rgba(0,0,0,.8);
  transition:transform .55s var(--ease),background .3s var(--ease),box-shadow .55s var(--ease);
}
.btn svg{width:17px;height:17px;fill:currentColor}
.btn:hover{transform:translateY(-2px);background:#A0182B;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 20px 40px -14px rgba(0,0,0,.85)}
.btn:active{transform:translateY(0)}

/* headline chips ----------------------------------------------------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips .lab{color:var(--mint);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.chip{
  appearance:none;border:1px solid rgba(255,255,255,.26);background:transparent;color:var(--mint);
  font:inherit;font-size:.9rem;font-weight:500;width:34px;height:34px;border-radius:50%;cursor:pointer;
  font-variant-numeric:tabular-nums;
  transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),transform .35s var(--ease);
}
.chip:hover{color:var(--white);border-color:rgba(255,255,255,.6);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--white);color:var(--felt);border-color:var(--white)}

/* suit grid ---------------------------------------------------------- */
.field{
  position:absolute;left:0;right:0;bottom:0;height:32%;z-index:1;pointer-events:none;
  display:grid;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 34%);
          mask-image:linear-gradient(to bottom,transparent 0%,#000 34%);
}
.cell{position:relative}
.cell svg{
  position:absolute;inset:14%;fill:var(--white);opacity:0;
  transform:scale(.55) rotate(-12deg);
  transition:opacity 1s var(--ease),transform 1s var(--ease),fill .5s var(--ease);
  will-change:transform,opacity;
}
.cell svg.on{opacity:.3;transform:scale(1) rotate(0)}
.cell.red svg.on{fill:#C4374A;opacity:.3}
.cell.hot svg.on{opacity:1;fill:var(--white);transform:scale(1.14) rotate(0);
  filter:drop-shadow(0 0 14px rgba(255,255,255,.8))}

/* the wand cursor ---------------------------------------------------- */
.wand{
  position:fixed;top:0;left:0;width:132px;height:132px;z-index:5;pointer-events:none;
  opacity:0;transition:opacity .6s var(--ease);
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
}
.wand.live{opacity:1}
.wand .rod{fill:var(--bone)}
.wand .ferrule{fill:var(--gold)}
.wand .tipspark{fill:var(--white)}
.hero.wandmode{cursor:none}
.hero.wandmode a,.hero.wandmode button{cursor:pointer}

.hint{color:var(--mint);font-size:.85rem;display:flex;align-items:center;gap:9px}
.hint svg{width:13px;height:13px;fill:var(--gold)}

@media(max-width:760px){
  .mid{padding-top:clamp(16px,3vh,30px)}
  .field{height:30%}
  .hero{padding-bottom:calc(30svh + 8px)}
  .wand{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
  h1 .w i{transform:none;opacity:1}
  .wand{display:none}
}
</style>
</head>
<body>

<!-- SET A "sharp" suits: flat, straight-cut, one chevron notch each (the same
     chevron that cuts the Gabarito Black logo counters). Set A is used for the
     field because at 30–60 px its silhouettes stay crisp and its straight edges
     share a vocabulary with the square and the diamond the cells morph through;
     the classic set's curves go mushy at that size and start reading as a deck
     of cards, which the brand explicitly does not want. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="sq" viewBox="0 0 100 100"><path d="M14 14 H86 V86 H14 Z"/></symbol>
  <symbol id="dia" viewBox="0 0 100 100"><path d="M50 4 L84 50 L50 96 L16 50 Z"/></symbol>
  <symbol id="spade" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M50 6 L14 46 L14 62 L30 70 L44 62 L44 66 L32 90 L68 90 L56 66 L56 62 L70 70 L86 62 L86 46 Z M34 40 L46 51 L34 62 L27 57.5 L33.5 51 L27 44.5 Z"/></symbol>
  <symbol id="heart" viewBox="0 0 100 100"><path fill-rule="evenodd" d="M50 91 L12 46 L12 30 L26 17 L40 17 L50 29 L60 17 L74 17 L88 30 L88 46 Z M38 42 L50 53 L38 64 L31 59.5 L37.5 53 L31 46.5 Z"/></symbol>
  <symbol id="club" viewBox="0 0 100 100"><path d="M50 9 L67 19 L67 33 L50 43 L33 33 L33 19 Z M27 35 L44 45 L44 59 L27 69 L10 59 L10 45 Z M73 35 L90 45 L90 59 L73 69 L56 59 L56 45 Z M44 30 L56 30 L63 90 L37 90 Z M44 18 L38 21.4 L43.5 26 L38 30.6 L44 34 L54 26 Z"/></symbol>
  <symbol id="sparkle" viewBox="0 0 100 100"><path d="M50 2 C54 30 70 46 98 50 C70 54 54 70 50 98 C46 70 30 54 2 50 C30 46 46 30 50 2 Z"/></symbol>
</defs></svg>

<main class="hero wandmode" id="hero">
  <a class="mark" href="#top"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#sparkle"/></svg><span>kadabra</span></a>

  <div class="mid">
    <h1 id="headline"></h1>
    <p class="sub">Half-day, hands-on AI workshops for teams in Costa Rica. Your real work, your tools, nothing to buy afterwards.</p>
    <div class="cta-row">
      <a class="btn" href="#TODO-whatsapp"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#spade"/></svg>Talk to us on WhatsApp</a>
      <span class="hint"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#sparkle"/></svg><span>Move the wand over the field.</span></span>
    </div>
  </div>

  <div class="chips" role="group" aria-label="Headline candidates">
    <span class="lab">Headline</span>
    <button class="chip" type="button" aria-pressed="true">1</button>
    <button class="chip" type="button" aria-pressed="false">2</button>
    <button class="chip" type="button" aria-pressed="false">3</button>
    <button class="chip" type="button" aria-pressed="false">4</button>
    <button class="chip" type="button" aria-pressed="false">5</button>
  </div>

  <div class="field" id="field" aria-hidden="true"></div>
</main>

<svg class="wand" id="wand" viewBox="0 0 120 120" aria-hidden="true">
  <path class="rod" d="M15 99 L93 25 L95 27 L21 105 Z"/>
  <path class="ferrule" d="M28.2 84.8 L34.3 78.7 L41.3 85.7 L35.2 91.8 Z"/>
  <g class="tipspark" transform="translate(76 0) scale(.34)"><use href="#sparkle" width="100" height="100"/></g>
</svg>

<script>
const HEADLINES=[
  "The trick is teaching, not tools.",
  "Nothing up our sleeves. Just your work, done faster.",
  "Your team already holds the wand. We teach the trick.",
  "Less magic show. More magic.",
  "Learn the trick behind the trick."
];
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const h1=document.getElementById('headline');
if(!matchMedia('(pointer: fine)').matches)
  document.querySelector('.hint span').textContent='Tap the field. It answers.';

/* headline arrives per word, randomised stagger, power4-style ease ----- */
function setHeadline(text){
  h1.classList.remove('in');
  h1.innerHTML=text.split(' ').map(w=>`<span class="w"><i>${w}</i></span>`).join(' ');
  const parts=[...h1.querySelectorAll('i')];
  parts.forEach((el,i)=>{el.style.transitionDelay=(i*0.062+Math.random()*0.075).toFixed(3)+'s';});
  requestAnimationFrame(()=>requestAnimationFrame(()=>h1.classList.add('in')));
}
setHeadline(HEADLINES[0]);
document.querySelectorAll('.chip').forEach((b,i)=>b.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(o=>o.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  setHeadline(HEADLINES[i]);
}));

/* the field ----------------------------------------------------------- */
const SHAPES=['sq','dia','spade','heart','club'];
const field=document.getElementById('field');
let cells=[],cols=0,rows=0,cw=0,ch=0,rect=null;

function build(){
  const w=field.clientWidth,h=field.clientHeight;
  const target=w<680?46:Math.min(74,Math.max(52,w/22));
  cols=Math.max(6,Math.round(w/target));
  rows=Math.max(3,Math.round(h/target));
  cw=w/cols;ch=h/rows;
  field.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  field.style.gridTemplateRows=`repeat(${rows},1fr)`;
  field.innerHTML='';cells=[];
  const frag=document.createDocumentFragment();
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const d=document.createElement('div');d.className='cell';
    if((c*7+r*11)%13===0) d.classList.add('red');
    d.innerHTML=SHAPES.map(s=>`<svg viewBox="0 0 100 100"><use href="#${s}"/></svg>`).join('');
    const start=(c+r*2)%SHAPES.length;
    d.children[start].classList.add('on');
    frag.appendChild(d);
    cells.push({el:d,layers:[...d.children],i:start,c,r,hot:0});
  }
  field.appendChild(frag);
  rect=field.getBoundingClientRect();
}
build();
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(build,220)});
addEventListener('scroll',()=>{rect=field.getBoundingClientRect()},{passive:true});

function show(cell,idx){
  if(idx===cell.i)return;
  cell.layers[cell.i].classList.remove('on');
  cell.i=idx;cell.layers[idx].classList.add('on');
}

/* two non-harmonic clocks (7.3 s and 11.9 s) drive the field, so the whole
   thing breathes and the pattern never visibly repeats */
if(!REDUCED){
  const TAU=Math.PI*2,P1=7300,P2=11900;
  setInterval(()=>{
    const t=performance.now();
    for(const k of cells){
      if(k.hot>t)continue;
      const v=Math.sin((t/P1+k.c*.21+k.r*.47)*TAU)+Math.sin((t/P2+k.c*.53-k.r*.19)*TAU);
      show(k,Math.min(4,Math.max(0,Math.floor((v+2)/4*5))));
    }
  },170);
}

/* the cursor is the wand ---------------------------------------------- */
const wand=document.getElementById('wand');
let tx=innerWidth*.5,ty=innerHeight*.6,wx=tx,wy=ty,live=false;

function touch(px,py){
  if(!rect)return;
  const cx=(px-rect.left)/cw,cy=(py-rect.top)/ch;
  if(cy<-1.6||cy>rows+1.6)return;
  const now=performance.now();
  for(let r=Math.floor(cy)-1;r<=Math.floor(cy)+1;r++)
    for(let c=Math.floor(cx)-1;c<=Math.floor(cx)+1;c++){
      if(r<0||c<0||r>=rows||c>=cols)continue;
      const d=Math.hypot(c+.5-cx,r+.5-cy);
      if(d>1.35)continue;
      const k=cells[r*cols+c];
      if(k.hot>now-260)continue;
      k.hot=now+420;
      k.el.classList.add('hot');
      show(k,(k.i+1+((Math.random()*3)|0))%SHAPES.length);
      setTimeout(()=>k.el.classList.remove('hot'),430);
    }
}

if(!REDUCED){
  addEventListener('pointermove',e=>{
    tx=e.clientX;ty=e.clientY;
    if(!live){live=true;wx=tx;wy=ty;wand.classList.add('live')}
    if(e.pointerType!=='touch')touch(tx,ty);
  },{passive:true});
  /* tap does the same on touch */
  addEventListener('pointerdown',e=>{tx=e.clientX;ty=e.clientY;touch(tx,ty);},{passive:true});

  (function loop(){
    wx+=(tx-wx)*.14;wy+=(ty-wy)*.14;          /* the slight lag */
    const tilt=Math.max(-9,Math.min(9,(tx-wx)*.18));
    wand.style.transform=`translate3d(${wx-96}px,${wy-14}px,0) rotate(${tilt}deg)`;
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
